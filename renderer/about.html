<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>About Koi</title>
<link rel="stylesheet" href="koi.css">
<style>
html,body{height:100%;background:#0c0716;overflow:hidden}
body{padding:40px 20px 20px;background:radial-gradient(70% 40% at 0% 0%,rgba(255,46,136,.2),transparent 70%),radial-gradient(70% 40% at 100% 100%,rgba(22,198,255,.14),transparent 70%),#0c0716;color:#fff}
.drag{position:fixed;left:0;right:0;top:0;height:36px;-webkit-app-region:drag}
#hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 24px 26px;border-radius:34px;--hc:#ff2e88;--hc2:#7a3cff;animation:heroIn .8s cubic-bezier(.3,1.45,.5,1) both}
#hero .big{width:120px;height:120px;border-radius:36px;display:grid;place-items:center;background:radial-gradient(circle at 32% 18%,rgba(255,255,255,.5),transparent 46%),linear-gradient(150deg,#2c0f46,#12061f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 8px rgba(255,46,136,.14),0 22px 44px -14px var(--pink);animation:tile .9s cubic-bezier(.3,1.7,.5,1) .1s both}
#hero .title{font-size:66px;margin-top:6px}
#hero .v{font:850 12px/1 var(--head);letter-spacing:.2em;text-transform:uppercase;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.facts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0;animation:heroIn .8s cubic-bezier(.3,1.45,.5,1) .1s both}
.facts div{padding:14px 12px;border-radius:20px;text-align:center}
.facts b{display:block;font:900 22px/1 var(--head);letter-spacing:-.04em;background:linear-gradient(180deg,#fff,color-mix(in oklab,var(--c) 50%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.facts span{font:700 11px/1.3 var(--head);color:var(--mut)}
.acts{display:flex;gap:8px;justify-content:center;animation:heroIn .8s cubic-bezier(.3,1.45,.5,1) .16s both}
.fine{text-align:center;font:650 11px/1.5 var(--head);color:var(--mut);margin-top:14px}
</style></head><body><div class="drag"></div>
<div class="hero" id="hero"><div class="big" id="big"></div><div class="title">Koi</div><div class="sub">Every app, one flick away. A springy fan app switcher for your Mac.</div><span class="v" id="v">Version 2.0.0</span></div>
<div class="facts"><div class="slab" style="--c:#ff2e88"><b>8</b><span>wedges per page</span></div><div class="slab" style="--c:#16c6ff"><b>Zero</b><span>loops while closed</span></div><div class="slab" style="--c:#ffad1f"><b>3 s</b><span>to update</span></div></div>
<div class="acts"><button class="btn" id="upd">Check for updates</button><button class="btn ghost" id="notes">Release notes</button></div>
<div class="fine">Made with springs. No emojis, no tracking, no network except the update check.</div>
<script src="spring.js"></script>
<script>
const q=new URLSearchParams(location.search),api=window.koiAPI&&window.koiAPI.pop;
KoiHero(document.getElementById('hero'));document.getElementById('big').innerHTML=KoiMark(84);
document.getElementById('v').textContent='Version '+(q.get('v')||'2.0.0');
document.querySelectorAll('.btn').forEach(b=>KoiSpring.jelly(b,1.06));
document.getElementById('upd').onclick=()=>api&&api.action('update');
document.getElementById('notes').onclick=()=>api&&api.action('repo');
</script></body></html>
