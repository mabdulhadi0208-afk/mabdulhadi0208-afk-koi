<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koi 2.1, the fan app switcher</title>
<style>
/* Koi 2.0 in Lumen's design language (Lumen 4.0, docs/NOVA.md): the accent #5b8cff with its two partners, the 4.1
   palette (cyan, violet, amber, pink, deep), Lumen's liquid glass recipe painted with gradients (rims, sheen,
   coloured shadows; no live blur in the fan), gems of colour for the selected things, Lumen's display type.
   Only transform and opacity ever animate, and the fan's spring loop stops the moment everything has settled. */
:root{--accent:#5b8cff;--accent2:#a66be3;--accent3:#f4679b;--c-cyan:#13c1cd;--c-violet:#6519ce;--c-amber:#fdb173;--c-pink:#e21583;--c-deep:#262488;
 --pink:var(--accent);--pink2:#3f63d6;--vio:var(--accent2);--cyan:var(--c-cyan);--amber:var(--c-amber);--ink:#0a0c15;
 --koi:linear-gradient(135deg,var(--accent),var(--accent2) 55%,var(--accent3));
 --banner:radial-gradient(circle,rgba(255,255,255,.22) 1px,transparent 1.6px) 0 0/13px 13px,radial-gradient(55% 120% at 0% 0%,rgba(255,255,255,.18),transparent 60%),radial-gradient(38% 110% at 100% 110%,color-mix(in srgb,var(--c-amber) 60%,transparent),transparent 70%),radial-gradient(40% 120% at 70% -20%,color-mix(in srgb,var(--c-cyan) 70%,transparent),transparent 70%),linear-gradient(118deg,var(--c-deep),color-mix(in srgb,var(--accent) 85%,#000) 42%,color-mix(in srgb,var(--c-pink) 82%,#000));
 --rim41:linear-gradient(120deg,var(--c-cyan),rgba(255,255,255,.85) 22%,var(--accent) 45%,var(--c-violet) 66%,var(--c-pink));
 --head:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--ink);color:#f0f1f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
html:has(body.ov),body.ov{background:transparent!important}
kbd{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 7px;border-radius:7px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.25);color:#fff}

/* ---------------- the demo desktop (tour and web) ---------------- */
.wall{position:fixed;inset:0;background:radial-gradient(1px 1px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 33% 68%,#fff,transparent),radial-gradient(1.4px 1.4px at 58% 18%,#fff,transparent),radial-gradient(1px 1px at 76% 54%,#fff,transparent),radial-gradient(1px 1px at 90% 30%,#fff,transparent),radial-gradient(1.2px 1.2px at 47% 88%,#fff,transparent),radial-gradient(1px 1px at 6% 80%,#fff,transparent),radial-gradient(1px 1px at 66% 8%,#fff,transparent),radial-gradient(45% 55% at 8% 0%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%),radial-gradient(45% 50% at 100% 100%,color-mix(in srgb,var(--accent3) 40%,transparent),transparent 70%),radial-gradient(35% 40% at 72% 10%,color-mix(in srgb,var(--c-cyan) 30%,transparent),transparent 70%),radial-gradient(30% 35% at 30% 100%,color-mix(in srgb,var(--accent2) 35%,transparent),transparent 70%),linear-gradient(180deg,#121530,#0a0c1a 60%,#080a14)}
.wall .pn{position:absolute;border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.wall .p1{left:2vw;top:20vh;width:24vw;height:90vh}.wall .p2{left:29vw;top:36vh;width:27vw;height:80vh}.wall .p3{left:60vw;top:26vh;width:30vw;height:80vh;transform:rotate(1.5deg)}.wall .p4{left:93vw;top:30vh;width:20vw;height:80vh}
body.lt .wall{background:radial-gradient(45% 55% at 8% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%),radial-gradient(45% 50% at 100% 100%,color-mix(in srgb,var(--accent3) 24%,transparent),transparent 70%),radial-gradient(35% 40% at 72% 10%,color-mix(in srgb,var(--c-cyan) 18%,transparent),transparent 70%),#f5f6fb}
body.lt .wall .pn{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.3));box-shadow:0 10px 40px rgba(91,140,255,.1)}
.menubar{position:fixed;top:0;left:0;right:0;height:28px;background:rgba(10,12,21,.72);display:flex;align-items:center;gap:18px;padding:0 14px;font-size:13px;font-weight:500;z-index:12;color:#efe6ff;box-shadow:inset 0 -1px 0 rgba(255,255,255,.06)}
body.lt .menubar{background:rgba(250,251,255,.8);color:#141722;box-shadow:inset 0 -1px 0 rgba(20,24,40,.08)}
.menubar b{font-weight:700}.menubar .sp{flex:1}
.menubar .koi{display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 8px;border-radius:6px}
.menubar .koi:hover{background:rgba(255,255,255,.1)}
.hero{position:fixed;right:5vw;top:15vh;max-width:400px;z-index:1}
.hero .eye{font:800 11px/1 var(--head);letter-spacing:.2em;text-transform:uppercase;color:#a9c0ff;margin-bottom:12px}
.hero h1{font:800 46px/1.02 var(--head);letter-spacing:-.045em;margin-bottom:14px;background:linear-gradient(100deg,#fff 30%,#c4d4ff 65%,#c9a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:15px;line-height:1.65;color:rgba(240,241,248,.72)}
body.lt .hero h1{background:linear-gradient(100deg,#2a0f3f 25%,#3f63d6 70%,#a66be3);-webkit-background-clip:text;background-clip:text}
body.lt .hero p{color:rgba(20,23,34,.7)}body.lt kbd{background:linear-gradient(180deg,#fff,#efe6f6);color:#141722;box-shadow:inset 0 -2px 0 rgba(20,24,40,.15),0 1px 2px rgba(20,24,40,.15)}
.ctl{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:9px 12px;border-radius:20px;background:linear-gradient(180deg,rgba(22,26,48,.92),rgba(12,14,26,.94));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.07),0 22px 44px -16px rgba(91,140,255,.45),0 10px 30px rgba(0,0,10,.4);font-size:12.5px;z-index:12;white-space:nowrap}
body.lt .ctl{background:linear-gradient(180deg,#fff,#fbf1fa);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(20,24,40,.1),0 22px 44px -18px rgba(91,140,255,.45)}
.ctl label{color:rgba(240,241,248,.55);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
body.lt .ctl label{color:rgba(20,23,34,.5)}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:11px;padding:2px}
body.lt .seg{background:rgba(20,24,40,.06)}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:9px;font-size:12.5px;font-weight:650;color:rgba(240,241,248,.65);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
body.lt .seg button{color:rgba(20,23,34,.6)}
.seg button.on{color:#fff;background:var(--banner);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -6px var(--pink)}
.go{all:unset;cursor:pointer;background:var(--koi);color:#fff;padding:7px 15px;border-radius:11px;font-weight:750;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 22px -10px var(--pink);transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.go:hover,.seg button:hover{transform:scale(1.06)}.go:active{transform:scale(.94)}
.ghost{background:rgba(255,255,255,.1)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)!important}
body.lt .ghost{background:rgba(20,24,40,.07)!important;color:#141722!important;box-shadow:none!important}
#toast{position:fixed;top:44px;left:50%;transform:translate(-50%,-30px);opacity:0;padding:10px 18px;border-radius:16px;background:linear-gradient(180deg,rgba(26,30,52,.96),rgba(12,14,26,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 14px 30px -10px rgba(91,140,255,.5);color:#fff;font-size:14px;font-weight:650;z-index:20;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s}
#toast.on{transform:translate(-50%,0);opacity:1}

/* ---------------- the fan ---------------- */
#stage{position:fixed;left:0;top:0;width:0;height:0;z-index:11;pointer-events:none}
#stage.gone{opacity:0}
#pool,#halo{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none;opacity:0;will-change:transform,opacity}
#pool{width:640px;height:640px;margin:-320px 0 0 -320px;background:radial-gradient(closest-side,rgba(10,12,21,.62) 0,rgba(10,12,21,.5) 52%,rgba(244,103,155,.26) 70%,rgba(166,107,227,.12) 84%,transparent)}
#halo{width:500px;height:500px;margin:-250px 0 0 -250px;background:radial-gradient(closest-side,transparent 52%,rgba(91,140,255,.22) 70%,rgba(166,107,227,.12) 84%,transparent)}
body.lt #pool{background:radial-gradient(closest-side,rgba(250,251,255,.7) 0,rgba(245,247,255,.55) 52%,rgba(244,103,155,.22) 72%,rgba(166,107,227,.1) 86%,transparent)}
.w{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity;visibility:hidden}
.w svg{position:absolute;left:0;top:0;overflow:visible}
.w .hl,.w .gl{opacity:0;transition:opacity .16s}
.w.sel .hl{opacity:.92}.w.sel .gl{opacity:1}
.w .ct{position:absolute;left:0;top:0;width:56px;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;gap:7px;will-change:transform}
.ic{width:52px;height:52px;border-radius:14px;position:relative;display:grid;place-items:center}
.ic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 7px rgba(0,0,20,.45))}
.ic .mono{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font:800 22px/1 var(--head);color:#fff;text-shadow:0 1px 2px rgba(0,0,30,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -6px 10px -6px rgba(0,0,30,.45),0 6px 12px -4px rgba(0,0,20,.5);position:relative;overflow:hidden}
.ic .mono:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 50%)}
.ic .mono svg{width:26px;height:26px;position:relative;z-index:1}
.kl{font:800 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(240,241,248,.7);padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.w.sel .kl{color:#fff;background:rgba(255,255,255,.24)}
body.lt .kl{color:rgba(20,23,34,.6);background:rgba(20,24,40,.06);box-shadow:none}body.lt .w.sel .kl{color:#fff;background:rgba(255,255,255,.32)}
.run{position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff4ff,var(--cyan) 60%);box-shadow:0 0 0 2px #1a0e2c,0 0 10px 1px var(--cyan);z-index:2}
body.lt .run{box-shadow:0 0 0 2px #fff,0 0 8px var(--cyan)}
/* the hub: a hero disc for the app you are on */
#hub{position:absolute;left:0;top:0;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;opacity:0;will-change:transform,opacity;overflow:hidden;
 box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.7),inset 0 0 26px rgba(255,255,255,.18),inset 0 -16px 30px -18px rgba(0,0,0,.3),inset 2.5px 0 0 -1px rgba(255,80,150,.24),inset -2.5px 0 0 -1px rgba(60,190,255,.26),0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),0 0 0 8px color-mix(in srgb,var(--accent) 10%,transparent),0 18px 40px -18px var(--accent)}
#hub .hb{position:absolute;inset:0;border-radius:50%;transition:opacity .22s}
#hub .hb.off{opacity:0}
#hub .pl{position:absolute;left:-30%;top:-55%;width:110%;height:100%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.38),rgba(255,255,255,0))}
#hub .wm{position:absolute;right:-26px;bottom:-58px;font:900 190px/1 var(--head);letter-spacing:-.08em;color:#fff;opacity:.11;transform:rotate(-12deg)}
#hub .tile{position:absolute;left:50%;top:30px;width:62px;height:62px;margin-left:-31px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 32% 18%,rgba(255,255,255,.6),transparent 46%),rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 12px -6px rgba(0,0,30,.4),0 12px 22px -8px rgba(0,0,20,.55)}
#hub .tile .ic{width:50px;height:50px}#hub .tile .run{display:none}
#hub b{position:absolute;left:12px;right:12px;top:102px;text-align:center;font:800 21px/1.05 var(--head);letter-spacing:-.035em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 10px rgba(0,0,30,.35)}
#hub span{position:absolute;left:0;right:0;top:134px;text-align:center;font:800 9.5px/1 var(--head);letter-spacing:.18em;color:rgba(255,255,255,.78)}
#hub .sh{position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%);transform:translateX(-120%);opacity:0}
#hub.sweep .sh{animation:sweep .7s cubic-bezier(.3,.6,.3,1) both}
@keyframes sweep{0%{opacity:1;transform:translateX(-120%)}100%{opacity:1;transform:translateX(120%)}}
#q{position:absolute;left:0;top:0;padding:6px 14px;border-radius:99px;background:var(--banner);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 22px -8px var(--pink);font:800 15px ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#fff;will-change:transform,opacity;opacity:0;white-space:nowrap}
.chip{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;display:grid;place-items:center;pointer-events:auto;cursor:pointer;opacity:0;transform:scale(.3);isolation:isolate;
 background:radial-gradient(120% 100% at 30% 0%,rgba(255,255,255,.2),transparent 60%),linear-gradient(180deg,#1e2443,#0f1220);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.3),inset -1px -1px 0 rgba(255,255,255,.06),inset 0 0 14px color-mix(in srgb,var(--accent) 22%,transparent),0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent),0 8px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent);
 transition:opacity .18s,transform .45s cubic-bezier(.3,1.7,.5,1);will-change:transform,opacity}
.chip svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip:before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--banner);opacity:0;transition:opacity .15s;z-index:-1}
.chip:hover:before,.chip.fh:before{opacity:1}
.chip.on{opacity:1;transform:scale(1)}.chip:hover,.chip.fh{transform:scale(1.14)!important}
.chip i{position:absolute;top:46px;left:50%;transform:translateX(-50%);font:700 11px -apple-system,system-ui,sans-serif;font-style:normal;white-space:nowrap;padding:4px 9px;border-radius:9px;background:rgba(12,14,26,.92);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
.chip:hover i,.chip.fh i{opacity:1}
body.lt .chip{background:radial-gradient(circle at 34% 22%,#fff,transparent 50%),linear-gradient(160deg,#fff,#f3e6f7);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(20,24,40,.12),0 10px 20px -8px rgba(20,24,60,.4)}
body.lt .chip svg{stroke:#1d2350}body.lt .chip:hover svg,body.lt .chip.fh svg{stroke:#fff}
.sp{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;pointer-events:none}

/* ---------------- the film ---------------- */
#film{position:fixed;inset:0;z-index:60;display:none;overflow:hidden}
#film #bk{position:absolute;inset:0;background:#06070f;opacity:1;transition:opacity 1.4s ease}
#film .bar{position:absolute;left:0;right:0;height:7vh;background:#000;transition:transform 1.1s cubic-bezier(.3,1.2,.5,1);z-index:3}
#film .bar.t{top:0;transform:translateY(-101%)}#film .bar.b{bottom:0;transform:translateY(101%)}
#film.on .bar{transform:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(3,4,10,.7));pointer-events:none;z-index:2}
#scene{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;z-index:1;pointer-events:none}
#scene>*{grid-area:1/1}
#scene .btns{pointer-events:auto}
.pools{position:absolute;inset:0;pointer-events:none}
.pools i{position:absolute;border-radius:50%;opacity:0;animation:poolin 2.2s cubic-bezier(.2,.8,.3,1) forwards}
.pools .a{left:8%;top:6%;width:56vmin;height:56vmin;background:radial-gradient(closest-side,rgba(91,140,255,.5),transparent)}
.pools .b{right:6%;bottom:4%;width:62vmin;height:62vmin;background:radial-gradient(closest-side,rgba(166,107,227,.45),transparent);animation-delay:.2s}
.pools .c{right:22%;top:10%;width:30vmin;height:30vmin;background:radial-gradient(closest-side,rgba(19,193,205,.32),transparent);animation-delay:.4s}
.pools .d{left:24%;bottom:8%;width:26vmin;height:26vmin;background:radial-gradient(closest-side,rgba(253,177,115,.3),transparent);animation-delay:.55s}
@keyframes poolin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.beam{position:absolute;left:50%;top:-20%;width:70vmin;height:140%;margin-left:-35vmin;background:radial-gradient(50% 75% at 50% 0%,rgba(170,195,255,.24),rgba(91,140,255,.07) 55%,transparent 100%);transform-origin:50% 0;opacity:0;animation:beam 2.4s cubic-bezier(.2,.8,.3,1) .1s forwards;pointer-events:none}
@keyframes beam{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
.dl{width:min(460px,84vw);animation:fup .8s cubic-bezier(.3,1.4,.5,1) both;position:relative}
.dl .dr{display:flex;gap:16px;align-items:center;text-align:left;margin-bottom:18px}
.dl .di{width:58px;height:58px;border-radius:18px;background:radial-gradient(circle at 32% 18%,rgba(255,255,255,.6),transparent 46%),#2a1046;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 6px rgba(91,140,255,.14),0 16px 34px -10px var(--pink)}
.dl b{font:800 19px/1.1 var(--head);display:block;letter-spacing:-.02em}.dl small{font-size:13px;color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
.dl .pb{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.dl .pb i{display:block;height:100%;width:100%;border-radius:8px;background:linear-gradient(90deg,var(--amber),var(--pink) 45%,var(--vio));transform-origin:0 50%;transform:scaleX(0)}
.brand{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.brand .mk{position:relative;width:150px;height:150px}
.brand .mk svg{position:absolute;inset:0;overflow:visible}
.brand .mk .pe{transform-box:view-box;opacity:0;animation:petal 1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes petal{from{opacity:0;scale:.2}to{opacity:1;scale:1}}
.brand .ver{font:900 clamp(96px,19vmin,190px)/.9 var(--head);letter-spacing:-.07em;margin-right:.07em;display:flex;align-items:baseline;gap:.06em}
.brand .ver span{display:inline-block;opacity:0;animation:blurin 1s cubic-bezier(.2,.9,.3,1) forwards;background:linear-gradient(180deg,#fff 30%,#d6e2ff 70%,#e3b8ff);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.02em}
.brand .ver em{font-style:normal;font-size:.38em;letter-spacing:-.03em;padding:.12em .32em;margin-left:.12em;border-radius:.32em;background:var(--koi);color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 14px 30px -10px var(--pink);opacity:0;animation:pop2 .9s cubic-bezier(.3,1.8,.5,1) forwards;align-self:center}
@keyframes pop2{from{opacity:0;transform:scale(.3) rotate(-14deg)}to{opacity:1;transform:none}}
.brand p{font:600 clamp(15px,2.3vmin,21px)/1.3 var(--head);letter-spacing:.02em;color:rgba(255,255,255,.75);opacity:0;animation:fup 1s ease 1.6s forwards}
.wmk{position:absolute;right:-8vmin;bottom:-14vmin;width:78vmin;height:78vmin;opacity:0;transform:rotate(-16deg);animation:wmk 1.6s cubic-bezier(.3,1.3,.5,1) .3s forwards;pointer-events:none}
.wmk svg{width:100%;height:100%}
@keyframes wmk{from{opacity:0;transform:rotate(-40deg) scale(.7)}to{opacity:.09;transform:rotate(-16deg)}}
@keyframes blurin{from{opacity:0;transform:translateY(46px) scale(1.2);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fup{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.words{display:flex;flex-direction:column;gap:0}
