<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Koi update</title>
<link rel="stylesheet" href="koi.css">
<style>
html,body{height:100%;background:transparent;overflow:hidden;color:#fff}
#card{position:absolute;left:14px;right:14px;top:8px;bottom:22px;border-radius:32px;padding:18px 20px 16px;opacity:0;will-change:transform,opacity;display:flex;flex-direction:column;gap:12px;--hc:#ff2e88;--hc2:#7a3cff;
  box-shadow:0 30px 60px -22px rgba(6,0,18,.85),0 22px 46px -24px var(--hc),inset 0 1px 0 rgba(255,255,255,.3)}
#card.ready{--hc:#1fd49a;--hc2:#1690ff}#card.error{--hc:#ff8a1f;--hc2:#ff2e88}#card.installing{--hc:#7a3cff;--hc2:#16c6ff}
#card>.dc .w{background:radial-gradient(110% 150% at 0% 0%,color-mix(in oklab,var(--hc) 90%,transparent),transparent 60%),radial-gradient(100% 140% at 100% 110%,color-mix(in oklab,var(--hc2) 85%,transparent),transparent 62%),linear-gradient(160deg,color-mix(in oklab,var(--hc) 40%,#14062a),color-mix(in oklab,var(--hc2) 35%,#070419))}
.top{display:flex;align-items:center;gap:16px;-webkit-app-region:drag}
.ring{flex:none;width:78px;height:78px;position:relative;display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 32% 20%,rgba(255,255,255,.4),transparent 50%),rgba(0,0,20,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.12),0 14px 28px -12px var(--hc)}
.ring svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .mk{width:40px;height:40px;display:grid;place-items:center;will-change:transform}
.ring .pc{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font:900 11px/1 var(--head);padding:4px 7px;border-radius:99px;background:rgba(0,0,20,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);font-variant-numeric:tabular-nums;white-space:nowrap}
.t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.t b{font:900 27px/1.02 var(--head);letter-spacing:-.045em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(100deg,#fff 45%,color-mix(in oklab,var(--hc) 40%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:2px}
.t small{color:rgba(255,255,255,.8);font:650 12.5px/1.3 -apple-system,system-ui,sans-serif}
.ver{align-self:flex-start;display:flex;align-items:center;gap:6px;font:850 11px/1 var(--head);padding:6px 10px;border-radius:99px;background:rgba(0,0,20,.3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);white-space:nowrap}
.ver svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.bar{height:10px;border-radius:10px;background:rgba(0,0,20,.32);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;border-radius:10px;background:linear-gradient(90deg,#fff,color-mix(in oklab,var(--hc) 30%,#fff) 60%,#fff);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 14px #fff;will-change:transform}
.bar em{position:absolute;top:0;bottom:0;width:35%;border-radius:10px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);opacity:0}
.bar.ind em{opacity:1;animation:sl 1.15s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
.meta{display:flex;justify-content:space-between;font:750 11px/1 var(--head);color:rgba(255,255,255,.75);min-height:12px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:6px;margin-top:auto}
.lnk{all:unset;cursor:pointer;color:rgba(255,255,255,.82);font:750 12.5px/1 var(--head);padding:9px 12px;border-radius:12px;will-change:transform}.lnk:hover{background:rgba(255,255,255,.12);color:#fff}
.sp{flex:1}
#go{padding:12px 20px;font-size:14px;background:radial-gradient(90% 140% at 30% -20%,rgba(255,255,255,.55),transparent 55%),linear-gradient(135deg,color-mix(in oklab,var(--hc) 85%,#fff),var(--hc) 45%,var(--hc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 14px -8px rgba(0,0,40,.45),0 0 0 4px color-mix(in oklab,var(--hc) 25%,transparent),0 14px 28px -12px var(--hc)}
#ok{position:absolute;inset:0;border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:0;pointer-events:none;z-index:3;
  background:radial-gradient(80% 120% at 50% 0%,rgba(122,60,255,.9),transparent 70%),radial-gradient(80% 120% at 50% 110%,rgba(22,198,255,.7),transparent 70%),#120826}
#ok b{font:900 30px/1 var(--head);letter-spacing:-.05em}#ok small{font:700 12.5px/1 var(--head);color:rgba(255,255,255,.8)}
#ok .mk{will-change:transform}
#card.installing #ok{opacity:1;transition:opacity .25s}
#card.installing #ok .mk{animation:fold .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes fold{0%{transform:scale(.5) rotate(-120deg);opacity:0}100%{transform:none;opacity:1}}
</style></head><body>
<div class="hero" id="card">
 <div class="top"><div class="ring"><svg class="r" viewBox="0 0 78 78"><circle cx="39" cy="39" r="34" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="5"/><circle id="arc" cx="39" cy="39" r="34" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="213.6" stroke-dashoffset="213.6" style="filter:drop-shadow(0 0 4px #fff)"/></svg><div class="mk" id="mk"></div><span class="pc" id="pc"></span></div>
  <div class="t"><div class="eye" id="eye">Koi update</div><b id="title">Update Koi</b><small id="sub"></small></div><span class="ver" id="ver"></span></div>
 <div class="bar" id="bar"><i id="fill"></i><em></em></div><div class="meta"><span id="m1"></span><span id="m2"></span></div>
 <div class="row"><button class="lnk" id="skip">Skip this version</button><button class="lnk" id="later">Later</button><span class="sp"></span><button class="btn" id="go">Update now</button></div>
 <div id="ok"><div class="mk" id="okmk"></div><b>Restarting Koi</b><small>Back in about 3 seconds, right where you left it</small></div>
</div>
<script src="spring.js"></script>
<script>
const $=s=>document.querySelector(s),api=window.koiAPI&&window.koiAPI.upd,{Sp,jelly}=KoiSpring;
const card=$('#card');KoiHero(card);$('#mk').innerHTML=KoiMark(40,false,true);$('#okmk').innerHTML=KoiMark(64,false,true);
const cy=new Sp(-40,200,14),cs=new Sp(.86,200,13),co=new Sp(0,280,24),fw=new Sp(0,90,17),mr=new Sp(0,180,12);
const ap=()=>{card.style.opacity=Math.max(0,Math.min(1,co.x));card.style.transform=`translateY(${cy.x}px) scale(${cs.x})`};[cy,cs,co].forEach(s=>s.cb=ap);
fw.cb=()=>{const p=Math.max(0,Math.min(100,fw.x));$('#fill').style.transform=`scaleX(${p/100})`;$('#arc').style.strokeDashoffset=String(213.6*(1-p/100))};
mr.cb=()=>{$('#mk').style.transform=`rotate(${mr.x}deg) scale(${1+Math.abs(mr.v)*.0006})`};
let hidden=true;
function enter(){hidden=false;cy.jump(-40);cs.jump(.86);co.jump(0);cy.set(0);cs.set(1);co.set(1);mr.kick(-260)}
function leave(){hidden=true;cy.set(-24);cs.set(.94);co.set(0)}
document.querySelectorAll('.btn,.lnk').forEach(b=>jelly(b,1.06));
const fmt=b=>(b/1048576).toFixed(1)+' MB',secs=s=>s>=60?Math.round(s/60)+' min':Math.max(1,s)+' s';let U={},lastSt='';
const arrow='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
function paint(u){
 if(!u)return;U=u;if(hidden)enter();
 const s=u.status,v=String(u.latest||'').replace(/^v/,'');
 card.classList.toggle('ready',s==='ready'||s==='uptodate');card.classList.toggle('error',s==='error');card.classList.toggle('installing',s==='installing');
 $('#ver').innerHTML=u.latest&&s!=='uptodate'?`${u.current||''} ${arrow} ${v}`:(u.current||'');
 const T={available:['New version',`Koi ${v} is here`,u.size?`${fmt(u.size)}. It downloads in the background while you work.`:'It downloads in the background while you work.'],
  checking:['Koi update','Looking for updates','Asking GitHub, one moment'],
  downloading:['Downloading',`Koi ${v}`,u.speed?`${fmt(u.speed)}/s${u.eta?', about '+secs(u.eta)+' left':''}`:'Starting the download'],
  unpacking:['Almost there',`Checking Koi ${v}`,'Unpacking and verifying the download'],
  ready:['Ready to go',`Koi ${v} is ready`,'Restart to switch. It takes about 3 seconds, and your settings come along.'],
  installing:['Updating','Restarting Koi',''],
  error:['Update hiccup','The update paused',u.error?String(u.error).slice(0,90):'Try again in a moment.'],
  uptodate:['All good',`Koi ${u.current||''} is up to date`,'You have the newest Koi.']}[s]||['Koi update','Update Koi',''];
 $('#eye').textContent=T[0];$('#title').textContent=T[1];$('#sub').textContent=T[2];
 const busy=s==='checking'||s==='unpacking'||(s==='downloading'&&!u.size);
 $('#bar').classList.toggle('ind',busy);
 fw.set(s==='ready'||s==='unpacking'||s==='installing'||s==='uptodate'?100:s==='downloading'?(u.progress||0):0);
 $('#pc').textContent=s==='downloading'?(u.progress||0)+'%':s==='ready'?'Ready':s==='error'?'Paused':s==='uptodate'?'Latest':s==='available'?'New':'';
 $('#m1').textContent=s==='downloading'&&u.size?`${fmt(u.bytes||0)} of ${fmt(u.size)}`:s==='ready'?'Downloaded and verified':'';
 $('#m2').textContent=u.lastCheck?`Checked ${new Date(u.lastCheck).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`:'';
 $('#go').textContent=s==='ready'?'Restart and update':s==='downloading'||s==='unpacking'?'Cancel':s==='error'?'Try again':s==='checking'?'Checking':s==='uptodate'?'Close':'Download now';
 $('#skip').style.visibility=(s==='available'||s==='ready')?'visible':'hidden';$('#later').style.visibility=s==='installing'?'hidden':'visible';
 if(s!==lastSt){if(s==='ready'||s==='available')mr.kick(-300);lastSt=s}
}
$('#go').onclick=()=>{if(!api)return;const s=U.status;if(s==='ready')api.action('install');else if(s==='downloading'||s==='unpacking')api.action('cancel');else if(s==='error')api.action('check');else if(s==='uptodate')api.action('close');else if(s==='available')api.action('download')};
$('#later').onclick=()=>api&&api.action('later');$('#skip').onclick=()=>api&&api.action('skip');
if(api){api.state().then(paint);api.onState(paint);api.onHide&&api.onHide(leave)}else{paint({status:'downloading',latest:'v2.0.0',current:'1.0.20',size:98000000,bytes:41000000,progress:42,speed:6200000,eta:9,lastCheck:Date.now()})}
</script></body></html>
