<!DOCTYPE html><html><head><meta charset="utf-8"><style>
:root{--a:#6aa8ff;--b:#a07bff;--mut:#9a9fb8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;font:13px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;color:#f2f3ff;-webkit-font-smoothing:antialiased;user-select:none}
.card{position:absolute;left:12px;right:12px;top:8px;bottom:14px;border-radius:28px;background:linear-gradient(180deg,#171a2e,#0d0f1d);box-shadow:0 30px 70px -20px rgba(0,0,10,.9),0 0 60px -28px var(--a),inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.05);overflow:hidden;opacity:0;will-change:transform,opacity}
.aura{position:absolute;inset:-70%;filter:blur(60px);opacity:.17;background:conic-gradient(from 0deg,#6aa8ff,#a07bff,#ff5d8f,#6aa8ff);animation:s 18s linear infinite}@keyframes s{to{transform:rotate(1turn)}}
.card.ready .aura{opacity:.3}.card.error .aura{background:conic-gradient(from 0deg,#ff5c5c,#ffb300,#ff5c5c)}
.in{position:relative;height:100%;display:flex;flex-direction:column;padding:16px 20px 14px;gap:9px}
.top{display:flex;align-items:center;gap:14px;-webkit-app-region:drag}
.ic{width:48px;height:48px;border-radius:50%;background:linear-gradient(150deg,#7fb2ff,#5a3dff);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 10px 24px -8px rgba(90,80,255,.7)}
.ic svg{width:24px;height:24px}.busy .ic:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:#a9c4ff;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(1turn)}}
.t{flex:1;min-width:0}.t b{font-size:17px;display:block;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t small{color:var(--mut);display:block;margin-top:2px}
.ver{font-size:11px;color:var(--mut);padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.07);white-space:nowrap}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 14px var(--a);will-change:width}
.bar.ind i{width:35%!important;animation:sl 1.1s ease-in-out infinite}@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);min-height:14px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px;margin-top:auto}
.btn{all:unset;cursor:pointer;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 12px 26px -8px rgba(110,110,255,.8);will-change:transform}
.lnk{all:unset;cursor:pointer;color:var(--mut);font-size:12px;padding:8px 11px;border-radius:10px;will-change:transform}.lnk:hover{background:rgba(255,255,255,.08);color:#fff}
.sp{flex:1}.ok{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:12px;font-size:17px;font-weight:700;background:rgba(13,15,29,.97)}.ok.on{display:flex}

@keyframes jin{0%{opacity:0;transform:translateY(22px) scale(.85)}55%{opacity:1;transform:translateY(-4px) scale(1.03)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.card{animation:jin .9s cubic-bezier(.3,1.9,.5,1) both}.ic{animation:bob 3s ease-in-out infinite}
.btn,.lnk{transition:transform .45s cubic-bezier(.3,1.9,.5,1),filter .2s,box-shadow .3s}.btn:hover,.lnk:hover{transform:scale(1.07)}.btn:active,.lnk:active{transform:scale(.9,.94);transition-duration:.12s}
</style></head><body>
<div class="card" id="card"><div class="aura"></div><div class="in">
 <div class="top"><div class="ic"><svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="46" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="60" cy="60" r="17" fill="#fff"/></svg></div><div class="t"><b id="title">Update Koi</b><small id="sub">…</small></div><span class="ver" id="ver"></span></div>
 <div class="bar" id="bar"><i id="fill"></i></div><div class="meta"><span id="m1"></span><span id="m2"></span></div>
 <div class="row"><button class="lnk" id="skip">Skip this version</button><button class="lnk" id="later">Later</button><span class="sp"></span><button class="btn" id="go">Update now</button></div>
</div><div class="ok" id="ok">Restarting Koi…</div></div>
<script>
const $=s=>document.querySelector(s),api=window.koiAPI&&window.koiAPI.upd;
const SP=new Set();class Sp{constructor(x,k=230,c=14,cb){this.x=x;this.v=0;this.t=x;this.k=k;this.c=c;this.cb=cb;SP.add(this)}step(dt){this.v+=((this.t-this.x)*this.k-this.v*this.c)*dt;this.x+=this.v*dt;this.cb&&this.cb(this)}}
let last=performance.now();(function L(n){const dt=Math.min(.033,(n-last)/1000);last=n;SP.forEach(s=>s.step(dt));requestAnimationFrame(L)})(last);
const card=$('#card');const cy=new Sp(-46,180,12),cs=new Sp(.8,180,12),co=new Sp(0,260,24),fw=new Sp(0,120,16);
const ap=()=>{card.style.opacity=Math.max(0,Math.min(1,co.x));card.style.transform=`translateY(${cy.x}px) scale(${cs.x},${cs.x*(1+(1-cs.x)*.05)})`;$('#fill').style.width=Math.max(0,Math.min(100,fw.x))+'%'};
[cy,cs,co,fw].forEach(s=>s.cb=ap);cy.t=0;cs.t=1;co.t=1;
for(const b of document.querySelectorAll('.btn,.lnk')){const s=new Sp(1,300,13),q=new Sp(0,300,12);const a=()=>{b.style.transform=`scale(${s.x*(1+q.x*.05)},${s.x*(1-q.x*.05)})`};s.cb=a;q.cb=a;
 b.onpointerenter=()=>{s.t=1.08;q.v+=2};b.onpointerleave=()=>s.t=1;b.onpointerdown=()=>{s.t=.93;q.v-=4};b.onpointerup=()=>{s.t=1.08;q.v+=5}}
const fmt=b=>(b/1048576).toFixed(1)+' MB',secs=s=>s>=60?Math.round(s/60)+' min':s+' s';let U={};
function paint(u){U=u;card.className='card '+(u.status==='ready'?'ready':['checking','downloading','unpacking'].includes(u.status)?'busy':u.status==='error'?'error':'');
 $('#ver').innerHTML=u.latest?`${u.current} → ${String(u.latest).replace(/^v/,'')}`:(u.current||'');
 const T={available:[`Koi ${u.latest} is available`,u.size?`${fmt(u.size)} · downloads in the background`:'Downloads in the background'],checking:['Checking for updates…','One sec'],
  downloading:[`Downloading Koi ${u.latest}… ${u.progress||0}%`,u.speed?`${fmt(u.speed)}/s${u.eta?' · about '+secs(u.eta)+' left':''}`:'Starting…'],unpacking:[`Unpacking Koi ${u.latest}…`,'Verifying the download'],
  ready:[`Koi ${u.latest} is ready`,'Restart to switch — takes about 3 seconds.'],installing:['Restarting…',''],error:['Update hit a snag',u.error||'Try again'],uptodate:[`Koi ${u.current} is up to date`,'Nothing to do']}[u.status]||['Update Koi',''];
 $('#title').textContent=T[0];$('#sub').textContent=T[1];
 $('#bar').classList.toggle('ind',u.status==='checking'||u.status==='unpacking'||(u.status==='downloading'&&!u.size));
 fw.t=u.status==='ready'||u.status==='unpacking'?100:u.status==='downloading'?(u.progress||0):0;
 $('#m1').textContent=u.status==='downloading'&&u.size?`${fmt(u.bytes||0)} of ${fmt(u.size)}`:'';
 $('#m2').textContent=u.lastCheck?`Checked ${new Date(u.lastCheck).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`:'';
 const b=$('#go');b.textContent=u.status==='ready'?'Restart & update':u.status==='downloading'||u.status==='unpacking'?'Cancel':u.status==='error'?'Retry':u.status==='checking'?'Checking…':u.status==='uptodate'?'Close':'Update now';
 $('#skip').style.visibility=(u.status==='available'||u.status==='ready')?'visible':'hidden';$('#ok').classList.toggle('on',u.status==='installing')}
$('#go').onclick=()=>{if(!api)return;const s=U.status;if(s==='ready')api.action('install');else if(s==='downloading'||s==='unpacking')api.action('cancel');else if(s==='error')api.action('check');else if(s==='uptodate')api.action('close');else api.action('download')};
$('#later').onclick=()=>api&&api.action('later');$('#skip').onclick=()=>api&&api.action('skip');
if(api){api.state().then(paint);api.onState(paint)}else{paint({status:'downloading',latest:'v1.0.9',current:'1.0.8',size:98000000,bytes:41000000,progress:42,speed:6200000,eta:9,lastCheck:Date.now()})}
</script></body></html>
