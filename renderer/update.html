<!DOCTYPE html><html lang="en" class="dark"><head><meta charset="utf-8"><title>Koi update</title>
<link rel="stylesheet" href="koi.css">
<style>
/* Koi's update card as Lumen's (ui/update.html, 4.0): a poster. Pools of accent light settle once behind Nova glass,
   a giant faint version number and watermark glyph, the icon on a glowing tile wrapped in the progress ring,
   the huge title, the version tube that fills with light, and a nova pill. Restarting turns it into the restart
   screen: deep ink, an accent nebula, the icon in a glass orb and the new number at monument size.
   Nothing loops while it sits on screen (the only repeat is the short "checking" shimmer, 10 passes at most).
   The blurred blobs of Lumen's card are painted here as radial gradients, so there is no live blur at all. */
html,body{height:100%;background:transparent;overflow:hidden}
.card{position:absolute;inset:10px 12px 20px;border-radius:28px;background:var(--bg-solid);overflow:hidden;isolation:isolate;opacity:0;will-change:transform,opacity;
  box-shadow:0 0 0 .5px var(--line),0 2px 6px rgba(10,14,30,.3),0 16px 30px -12px color-mix(in srgb,var(--accent) 60%,transparent)}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;animation:settle 2.4s var(--ease) both}
.bg i:nth-child(1){left:-140px;top:-170px;width:460px;height:340px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 78%,transparent),transparent);--dx:-60px;--dy:-30px}
.bg i:nth-child(2){right:-130px;top:-150px;width:440px;height:320px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent2) 70%,transparent),transparent);--dx:60px;--dy:-20px;animation-delay:.08s}
.bg i:nth-child(3){left:30%;bottom:-230px;width:460px;height:340px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent3) 60%,transparent),transparent);--dx:20px;--dy:60px;animation-delay:.16s}
.bg i:nth-child(4){left:-60px;bottom:-240px;width:360px;height:320px;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 50%,transparent),transparent);--dx:-30px;--dy:50px;animation-delay:.24s}
@keyframes settle{from{transform:translate(var(--dx),var(--dy)) scale(.7);opacity:0}}
:root:not(.dark) .bg i{opacity:.78}
.bg .lb{position:absolute;inset:-40px -200px;opacity:.3;background:repeating-linear-gradient(105deg,transparent 0 46px,color-mix(in srgb,var(--accent) 40%,transparent) 48px 51px,transparent 53px 110px,rgba(255,255,255,.12) 112px 113px,transparent 115px 170px)}
:root:not(.dark) .bg .lb{opacity:.45;background:repeating-linear-gradient(105deg,transparent 0 46px,color-mix(in srgb,var(--accent) 24%,transparent) 48px 51px,transparent 53px 110px,rgba(255,255,255,.45) 112px 113px,transparent 115px 170px)}
.art{position:absolute;right:-34px;top:-30px;width:220px;height:220px;z-index:1;color:color-mix(in srgb,var(--accent) 60%,#fff);opacity:.18;transform:rotate(-12deg);pointer-events:none;animation:artin 1.4s .1s cubic-bezier(.16,1,.3,1) both}
.art svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
@keyframes artin{from{transform:rotate(-34deg) scale(1.3);opacity:0}}
.bignum{position:absolute;right:56px;top:-8px;z-index:1;pointer-events:none;font:800 128px/1 var(--display);letter-spacing:-.06em;white-space:nowrap;opacity:.22;background:linear-gradient(160deg,var(--accent),var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent;animation:numin 1.3s .15s cubic-bezier(.16,1,.3,1) both}
:root:not(.dark) .bignum{opacity:.16}
@keyframes numin{from{transform:translateY(20px) scale(1.15);opacity:0}}
.has-big .art{display:none}.error .bignum{display:none}.error .art{display:block;color:#ff6b6b}
/* the bezel: Nova glass over the light field (painted, not blurred) */
.bezel{position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(60% 70% at 30% 10%,rgba(255,255,255,.16),transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--bg-solid) 30%,transparent),color-mix(in srgb,var(--bg-solid) 55%,transparent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.08),inset 2px 0 0 rgba(255,90,150,.14),inset -2px 0 0 rgba(90,200,255,.16),inset 0 -34px 50px -30px color-mix(in srgb,var(--accent) 45%,transparent)}
.card::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:6;pointer-events:none;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 90%,#fff),rgba(255,255,255,.2) 25%,transparent 45%,transparent 60%,rgba(255,255,255,.15) 75%,var(--accent3));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.9}
.sheen{position:absolute;inset:0;pointer-events:none;z-index:5;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%);transform:translateX(-120%)}
.card.show .sheen{animation:sheen 1.5s .3s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes sheen{to{transform:translateX(120%)}}
.edge{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);z-index:6;background:var(--nova);box-shadow:0 0 14px var(--accent),0 0 2px var(--accent);opacity:0;border-radius:0 3px 3px 0}
.busy .edge,.ready .edge{opacity:1}
.in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:14px 16px 14px 14px;gap:10px}
.top{display:flex;align-items:center;gap:15px;-webkit-app-region:drag;height:70px;flex:none}
.ic{position:relative;width:66px;height:66px;flex:none;display:grid;place-items:center;border-radius:22px;isolation:isolate}
.ic:before{content:'';position:absolute;inset:6px;border-radius:18px;background:var(--nova);opacity:.6;z-index:-1;box-shadow:0 0 30px 6px color-mix(in srgb,var(--accent) 60%,transparent)}
.ic .tile{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(150deg,#1d2350,#0e1128);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 18px color-mix(in srgb,var(--accent) 55%,transparent)}
.ic svg.ring{position:absolute;inset:-4px;width:74px;height:74px;transform:rotate(-90deg);opacity:0;transition:opacity .4s}
.ic svg.ring rect{fill:none;stroke-width:3;stroke-linecap:round}
.ic svg.ring .bgc{stroke:var(--line)}
.ic svg.ring .fg{stroke:url(#g);stroke-dasharray:226;stroke-dashoffset:226}
.busy .ic svg.ring,.ready .ic svg.ring{opacity:1}
.ic .badge{position:absolute;right:-3px;bottom:-3px;width:24px;height:24px;border-radius:50%;display:none;place-items:center;background:var(--nova);box-shadow:0 0 0 3px var(--bg-solid),0 4px 12px color-mix(in srgb,var(--accent) 60%,transparent)}
.ic .badge svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.uptodate .ic .badge,.ready .ic .badge{display:grid;animation:chk .7s .15s cubic-bezier(.3,1.6,.5,1) both}
@keyframes chk{from{transform:scale(0) rotate(-60deg)}}
.t{flex:1;min-width:0}
.kick{display:inline-flex;align-items:center;gap:7px;font:800 10px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:color-mix(in srgb,var(--accent) 78%,var(--fg2));margin-bottom:6px}
.kick:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--nova);box-shadow:0 0 8px var(--accent)}
.t b{display:block;font:800 25px/1.1 var(--display);letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px;
  background:linear-gradient(100deg,var(--fg) 30%,color-mix(in oklab,var(--accent) 45%,#fff) 75%,color-mix(in oklab,var(--accent3) 70%,var(--fg)));-webkit-background-clip:text;background-clip:text;color:transparent}
:root:not(.dark) .t b{background:linear-gradient(100deg,var(--fg) 30%,color-mix(in oklab,var(--accent) 72%,#000) 75%,color-mix(in oklab,var(--accent3) 70%,var(--fg)));-webkit-background-clip:text;background-clip:text}
.t small{display:block;margin-top:3px;color:var(--fg2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{-webkit-app-region:no-drag;align-self:flex-start;width:30px;height:30px;flex:none;border:0;border-radius:11px;color:var(--fg2);background:none;display:grid;place-items:center;transition:transform .5s var(--spring)}
.x:hover{color:var(--fg);transform:rotate(90deg)}.x svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.ver{display:flex;align-items:center;gap:10px;height:38px;flex:none;padding:0 4px 0 6px;border-radius:999px}
.gl{position:relative;background:radial-gradient(70% 90% at 30% 10%,rgba(255,255,255,.2),transparent 70%),linear-gradient(170deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.08),inset 1.5px 0 0 rgba(255,90,150,.14),inset -1.5px 0 0 rgba(90,200,255,.16),inset 0 -12px 22px -14px color-mix(in srgb,var(--accent) 50%,transparent),0 0 0 .5px var(--line),0 8px 20px -10px color-mix(in srgb,var(--accent) 45%,transparent)}
:root:not(.dark) .gl{background:radial-gradient(70% 90% at 30% 10%,rgba(255,255,255,.6),transparent 70%),linear-gradient(170deg,rgba(255,255,255,.62),rgba(255,255,255,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.5),0 0 0 .5px var(--line),0 8px 20px -10px color-mix(in srgb,var(--accent) 45%,transparent)}
.chip{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:16px}
.chip.v{color:#fff;font:800 13px/18px var(--display);padding:5px 13px;background:var(--nova);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent),0 6px 16px color-mix(in srgb,var(--accent) 55%,transparent)}
.solo #from,.solo .arrow{display:none}
.bar{position:relative;flex:1;height:10px;border-radius:999px;overflow:hidden;background:color-mix(in srgb,var(--fg) 7%,transparent);box-shadow:inset 0 1px 2px rgba(0,0,0,.18),inset 0 0 0 .5px var(--line)}
.bar i{position:absolute;inset:0;border-radius:999px;background:var(--nova);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 75%,transparent),inset 0 1px 0 rgba(255,255,255,.55)}
.bar em{position:absolute;top:0;bottom:0;width:34%;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);opacity:0}
.spin .bar em{opacity:1;animation:slide 1.2s ease-in-out 10}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.arrow{width:18px;height:18px;flex:none;color:var(--fg3);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:8px;margin-top:auto;height:42px;flex:none}
.lft{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.chip.ok{display:none;align-items:center;gap:5px;color:#5fe0b5;background:rgba(18,184,134,.14);box-shadow:inset 0 0 0 1px rgba(18,184,134,.26),0 0 12px rgba(18,184,134,.18)}
:root:not(.dark) .chip.ok{color:#0f9f74}
.chip.ok svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.verified .chip.ok{display:inline-flex}
.meta{font-size:11.5px;color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.lnk{all:unset;cursor:default;height:42px;padding:0 14px;border-radius:999px;font:750 13px/42px var(--display);color:var(--fg2);will-change:transform}
.lnk:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 7%,transparent)}
/* restarting: the restart screen */
.rs{position:absolute;inset:0;z-index:8;border-radius:inherit;display:flex;align-items:center;gap:24px;padding:0 34px;opacity:0;pointer-events:none;color:#fff;overflow:hidden;
  background:radial-gradient(70% 120% at 15% 0%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 65%),radial-gradient(60% 110% at 100% 100%,color-mix(in srgb,var(--accent3) 45%,transparent),transparent 65%),radial-gradient(40% 80% at 60% 40%,color-mix(in srgb,var(--accent2) 30%,transparent),transparent 70%),#06070f}
.installing .rs{opacity:1;transition:opacity .3s}
.rs .orb{width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 33% 27%,#fff 0,rgba(255,255,255,.75) 7%,rgba(255,255,255,0) 26%),radial-gradient(circle at 66% 80%,color-mix(in srgb,var(--accent3) 85%,#fff) 0,transparent 42%),radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--accent) 22%,transparent) 0,color-mix(in srgb,var(--accent2) 52%,transparent) 64%,color-mix(in srgb,var(--accent2) 70%,#fff) 96%);
  box-shadow:inset 0 -12px 22px -6px color-mix(in srgb,var(--accent2) 70%,transparent),inset 0 3px 6px rgba(255,255,255,.7),inset 0 0 0 1px rgba(255,255,255,.45),0 26px 44px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
.installing .rs .orb{animation:orbin 1s var(--spring) both}@keyframes orbin{from{transform:scale(.3);opacity:0}}
.rs .num{position:absolute;right:-10px;bottom:-34px;font:900 150px/1 var(--display);letter-spacing:-.07em;opacity:.16;background:linear-gradient(160deg,#fff,var(--accent3));-webkit-background-clip:text;background-clip:text;color:transparent}
.rs .kick{color:color-mix(in srgb,var(--accent3) 45%,#fff)}
.rs b{display:block;font:900 32px/1 var(--display);letter-spacing:-.05em}
.rs small{display:block;margin-top:6px;color:rgba(255,255,255,.75);font-size:12.5px}
.rs .rail{display:flex;gap:6px;margin-top:12px}
.rs .rail i{height:4px;width:46px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.rs .rail i:after{content:"";position:absolute;inset:0;background:var(--nova);transform-origin:0 50%;transform:scaleX(0)}
.installing .rs .rail i:after{animation:fillr .5s ease-out forwards}.installing .rs .rail i:nth-child(2):after{animation-delay:.35s}.installing .rs .rail i:nth-child(3):after{animation-delay:.7s}
@keyframes fillr{to{transform:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset=".55" stop-color="#a66be3"/><stop offset="1" stop-color="#f4679b"/></linearGradient></defs></svg>
<div class="card" id="card"><div class="bg"><i></i><i></i><i></i><i></i><span class="lb"></span></div><div class="bignum" id="big"></div><div class="art" id="art"></div><div class="bezel"></div>
 <div class="in">
  <div class="top"><div class="ic"><div class="tile" id="mk"></div><svg class="ring" viewBox="0 0 74 74"><rect class="bgc" x="3" y="3" width="68" height="68" rx="23"/><rect class="fg" id="arc" x="3" y="3" width="68" height="68" rx="23"/></svg><span class="badge"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span></div>
   <div class="t"><div class="kick" id="eye">Koi update</div><b id="title">Update Koi</b><small id="sub"></small></div><button class="x" id="close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="ver gl" id="verrow"><span class="chip" id="from"></span><svg class="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><div class="bar" id="bar"><i id="fill"></i><em></em></div><span class="chip v" id="to"></span></div>
  <div class="row"><div class="lft"><span class="chip ok"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Verified</span><span class="meta" id="m1"></span></div><button class="lnk" id="skip">Skip</button><button class="lnk" id="later">Later</button><button class="btn" id="go">Update now</button></div>
 </div>
 <div class="rs"><div class="orb" id="orb"></div><div><div class="kick">Updating</div><b>Restarting Koi</b><small>Back in about 3 seconds, right where you left it</small><div class="rail"><i></i><i></i><i></i></div></div><div class="num" id="rnum"></div></div>
 <div class="sheen"></div><div class="edge" id="edge"></div>
</div>
<script src="spring.js"></script>
<script>
const $=s=>document.querySelector(s),api=window.koiAPI&&window.koiAPI.upd,{Sp,jelly}=KoiSpring;
if(new URLSearchParams(location.search).get('theme')==='light')document.documentElement.classList.remove('dark');
const card=$('#card');$('#mk').innerHTML=KoiMark(34);$('#orb').innerHTML=KoiMark(52,false,true);$('#art').innerHTML=KoiMark('100%',true);
const cy=new Sp(-30,300,22),cs=new Sp(.93,300,22),co=new Sp(0,320,28),fw=new Sp(0,120,20);
const ap=()=>{card.style.opacity=Math.max(0,Math.min(1,co.x));card.style.transform=`translateY(${cy.x}px) scale(${cs.x})`};[cy,cs,co].forEach(s=>s.cb=ap);
fw.cb=()=>{const p=Math.max(0,Math.min(100,fw.x))/100;$('#fill').style.transform=`scaleX(${p})`;$('#edge').style.transform=`scaleX(${p})`;$('#arc').style.strokeDashoffset=String(226*(1-p))};
let hidden=true;
function enter(){hidden=false;cy.jump(-30);cs.jump(.93);co.jump(0);cy.set(0);cs.set(1);co.set(1);card.classList.remove('show');void card.offsetWidth;card.classList.add('show')}
function leave(){hidden=true;cy.set(-18);cs.set(.96);co.set(0)}
document.querySelectorAll('.btn,.lnk').forEach(b=>jelly(b,1.04));
const fmt=b=>(b/1048576).toFixed(1)+' MB',secs=s=>s>=60?Math.round(s/60)+' min':Math.max(1,s)+' s';let U={};
function paint(u){
 if(!u)return;U=u;if(hidden)enter();
 const s=u.status,v=String(u.latest||'').replace(/^v/,'');
 card.className='card show '+s+(['checking','downloading','unpacking'].includes(s)?' busy':'')+(s==='checking'||s==='unpacking'||(s==='downloading'&&!u.size)?' spin':'')+(s==='ready'?' verified':'')+(v&&s!=='error'&&s!=='uptodate'?' has-big':'');
 $('#big').textContent=s==='error'||s==='uptodate'?'':v;$('#rnum').textContent=v;
 $('#from').textContent=u.current||'';$('#to').textContent=s==='uptodate'?(u.current||''):(v||u.current||'');$('#verrow').classList.toggle('solo',s==='uptodate'||!v);
 const T={available:['New version',`Koi ${v} is here`,u.size?`${fmt(u.size)}, downloads in the background while you work`:'Downloads in the background while you work'],
  checking:['Koi update','Looking for updates','Asking GitHub, one moment'],
  downloading:['Downloading',`Koi ${v}`,u.speed?`${fmt(u.speed)}/s${u.eta?', about '+secs(u.eta)+' left':''}`:'Starting the download'],
  unpacking:['Almost there',`Checking Koi ${v}`,'Unpacking and verifying the download'],
  ready:['Ready',`Koi ${v} is ready`,'Restart to switch. About 3 seconds; your settings come along.'],
  installing:['Updating','Restarting Koi',''],
  error:['Update paused','The update hit a snag',u.error?String(u.error).slice(0,90):'Try again in a moment.'],
  uptodate:['All good',`Koi ${u.current||''} is up to date`,'You have the newest Koi.']}[s]||['Koi update','Update Koi',''];
 $('#eye').textContent=T[0];$('#title').textContent=T[1];$('#sub').textContent=T[2];
 fw.set(s==='ready'||s==='unpacking'||s==='installing'||s==='uptodate'?100:s==='downloading'?(u.progress||0):0);
 $('#m1').textContent=s==='downloading'&&u.size?`${fmt(u.bytes||0)} of ${fmt(u.size)}`:s==='ready'?'Downloaded and checked':'';
 $('#go').textContent=s==='ready'?'Restart and update':s==='downloading'||s==='unpacking'?'Cancel':s==='error'?'Try again':s==='checking'?'Checking':s==='uptodate'?'Close':'Download now';
 $('#skip').style.display=(s==='available'||s==='ready')?'':'none';$('#later').style.display=s==='installing'||s==='uptodate'?'none':'';
}
$('#go').onclick=()=>{if(!api)return;const s=U.status;if(s==='ready')api.action('install');else if(s==='downloading'||s==='unpacking')api.action('cancel');else if(s==='error')api.action('check');else if(s==='uptodate')api.action('close');else if(s==='available')api.action('download')};
$('#later').onclick=()=>api&&api.action('later');$('#skip').onclick=()=>api&&api.action('skip');$('#close').onclick=()=>api&&api.action('close');
if(api){api.state().then(paint);api.onState(paint);api.onHide&&api.onHide(leave)}else{paint({status:'downloading',latest:'v2.0.0',current:'1.0.20',size:98000000,bytes:41000000,progress:42,speed:6200000,eta:9,lastCheck:Date.now()})}
</script></body></html>
