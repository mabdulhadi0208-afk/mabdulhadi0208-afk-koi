<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:100%;height:100%;overflow:hidden;background:transparent;font:13px -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;-webkit-user-select:none}
#wrap{position:absolute;left:0;right:0;bottom:16vh;display:flex;justify-content:center;pointer-events:none}
#panel{position:relative;display:flex;gap:14px;padding:20px;border-radius:34px;max-width:94vw;overflow:visible;background:rgba(246,247,252,.62);backdrop-filter:blur(34px) saturate(1.7);-webkit-backdrop-filter:blur(34px) saturate(1.7);border:1px solid rgba(255,255,255,.6);box-shadow:0 40px 100px rgba(20,24,60,.32),inset 0 1px 0 rgba(255,255,255,.7);opacity:0;transform-origin:50% 100%;color:#14172b}
body.dk #panel{background:rgba(26,28,40,.66);border-color:rgba(255,255,255,.14);color:#fff;box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1)}
#hl{position:absolute;top:12px;left:0;height:calc(100% - 24px);border-radius:26px;background:rgba(255,255,255,.7);box-shadow:0 10px 34px rgba(60,90,255,.28),0 0 0 2px rgba(80,120,255,.55);will-change:transform,width}
body.dk #hl{background:rgba(255,255,255,.14);box-shadow:0 10px 34px rgba(0,0,0,.4),0 0 0 2px rgba(130,160,255,.7)}
.cd{position:relative;width:176px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 10px 8px;will-change:transform}
.th{width:156px;height:104px;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,rgba(120,130,170,.25),rgba(120,130,170,.1));position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.th img.s{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}.th img.s.on{opacity:1}
.th img.ic{width:56px;height:56px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}.th img.s.on~img.ic{width:34px;height:34px;position:absolute;right:6px;bottom:6px}
.nm{font-weight:600;font-size:13px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div id="wrap"><div id="panel"><div id="hl"></div></div></div><script>
const api=window.koiAPI;const $=s=>document.querySelector(s);
const SP=new Set();class Sp{constructor(x,k=260,c=14){this.x=x;this.v=0;this.t=x;this.k=k;this.c=c;SP.add(this)}}
let last=performance.now();function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;SP.forEach(s=>{s.v+=((s.t-s.x)*s.k-s.v*s.c)*dt;s.x+=s.v*dt});draw();requestAnimationFrame(loop)}
const panel=$('#panel'),hl=$('#hl');let cards=[],idx=0,shown=false;
const pS=new Sp(.78,230,10),pY=new Sp(40,230,10),pO=new Sp(0,320,26),hX=new Sp(0,300,13),hW=new Sp(176,300,14),hQ=new Sp(0,300,9);
let cs=[];
function draw(){
 panel.style.opacity=Math.max(0,Math.min(1,pO.x));panel.style.transform=`translateY(${pY.x}px) scale(${pS.x})`;
 const q=Math.max(-.18,Math.min(.18,hX.v*.00035));
 hl.style.transform=`translateX(${hX.x}px) scale(${1+Math.abs(q)},${1-Math.abs(q)*.7})`;hl.style.width=hW.x+'px';
 cs.forEach((s,i)=>{const e=cards[i];if(e)e.style.transform=`scale(${s.x}) translateY(${(1-s.x)*-40}px)`})}
function build(apps,sel,dark){
 document.body.classList.toggle('dk',dark);SP.forEach(s=>{if(s.__c)SP.delete(s)});
 panel.querySelectorAll('.cd').forEach(e=>e.remove());cards=[];cs=[];
 apps.forEach((a,i)=>{const d=document.createElement('div');d.className='cd';d.dataset.n=a.name;d.innerHTML=`<div class="th"><img class="s"><img class="ic" src="${a.icon}"></div><div class="nm"></div>`;d.querySelector('.nm').textContent=a.name;panel.appendChild(d);cards.push(d);const s=new Sp(.01,260,10);s.__c=1;s.t=.96;cs.push(s);setTimeout(()=>{s.t=i===idx?1.09:.96},40+i*35)});
 idx=sel;shown=true;requestAnimationFrame(()=>{place(true);pS.t=1;pY.t=0;pO.t=1})}
function place(snap){const c=cards[idx];if(!c)return;const x=c.offsetLeft,w=c.offsetWidth;hX.t=x;hW.t=w;if(snap){hX.x=x;hW.x=w;hX.v=0}cs.forEach((s,i)=>s.t=i===idx?1.09:.96)}
function sel(i){idx=i;place(false)}
function thumbs(m){cards.forEach(c=>{const u=m[c.dataset.n];if(u){const im=c.querySelector('img.s');im.src=u;im.classList.add('on')}})}
function hide(){shown=false;pS.t=.9;pY.t=24;pO.t=0}
requestAnimationFrame(loop);api.sw.onShow(d=>build(d.apps,d.idx,d.dark));api.sw.onSel(sel);api.sw.onThumbs(thumbs);api.sw.onHide(hide);
</script></body></html>
