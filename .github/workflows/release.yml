name: Build Koi DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Build DMGs (retry on flaky hdiutil)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "=== attempt $attempt"
            for v in /Volumes/Koi*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
            rm -rf dist
            if npx electron-builder --mac --arm64 --x64 --publish never -c.extraMetadata.version=1.0.${{ github.run_number }} 2>&1 | tee build.log; [ "${PIPESTATUS[0]}" = "0" ]; then exit 0; fi
            msg=$(tail -25 build.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=attempt $attempt failed::$msg"
            sleep 8
          done
          exit 1
      - name: Verify signatures
        shell: bash
        run: |
          ls -la dist
          for a in dist/mac-arm64/Koi.app dist/mac/Koi.app; do
            if [ -d "$a" ]; then echo "== $a"; codesign -dv "$a" 2>&1 | head -8; codesign --verify --deep --strict "$a" || { echo "::error::signature invalid on $a"; exit 1; }; fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Koi 1.0.${{ github.run_number }}
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
          make_latest: true
      - uses: actions/upload-artifact@v4
        with: { name: koi-dmg, path: dist/*.dmg }
