name: Build Koi DMG
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --mac --arm64 --x64 --publish never
      - name: Ad-hoc sign (needed so Apple Silicon will launch it)
        run: |
          for f in dist/*.dmg; do echo "built $f"; done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.dmg
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with: { name: koi-dmg, path: dist/*.dmg }
