name: Build Koi DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Build DMGs
        shell: bash
        run: |
          set +e
          DEBUG=electron-builder npx electron-builder --mac --arm64 --x64 --publish never 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(tail -30 build.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build failed::$msg"
          fi
          exit $code
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Koi 1.0.${{ github.run_number }}
          files: dist/*.dmg
          generate_release_notes: true
          make_latest: true
      - uses: actions/upload-artifact@v4
        with: { name: koi-dmg, path: dist/*.dmg }
