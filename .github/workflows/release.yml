name: Build and release Koi
# A release is cut when package.json on main has a version that is not tagged yet (bump "version" to release).
# The updater inside Koi reads https://github.com/<repo>/releases/latest, then downloads Koi-mac-<arch>.zip
# (falling back to the .dmg), so every release must carry both zips and both DMGs.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    env:
      KOI_CERT_P12: ${{ secrets.KOI_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Version from package.json
        id: v
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$V is already released; bump package.json to release"; else echo "release=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.release == 'true'
        with: { node-version: 20 }
      - run: npm install
        if: steps.v.outputs.release == 'true'
      - name: Key hook that only listens to keys (falls back to the stock build if it cannot compile)
        if: steps.v.outputs.release == 'true'
        run: node build/patch-uiohook.js
      - name: Stable signing certificate (optional; keeps Accessibility across updates)
        # Only if the repo has the KOI_CERT_P12 (base64) and KOI_CERT_PASSWORD secrets, made by tools/make-signing-cert.sh.
        # Nothing is committed: the key lives only in the secret and in a throwaway keychain on this runner.
        if: steps.v.outputs.release == 'true' && env.KOI_CERT_P12 != ''
        env:
          KOI_CERT_P12: ${{ secrets.KOI_CERT_P12 }}
          KOI_CERT_PASSWORD: ${{ secrets.KOI_CERT_PASSWORD }}
        shell: bash
        run: |
          set +e
          KC="$RUNNER_TEMP/koi-sign.keychain-db"; KP=$(openssl rand -hex 16)
          echo "$KOI_CERT_P12" | base64 --decode > "$RUNNER_TEMP/koi.p12"
          security create-keychain -p "$KP" "$KC" && security set-keychain-settings -lut 3600 "$KC" && security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/koi.p12" -k "$KC" -P "$KOI_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/koi.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          H=$(security find-identity -p codesigning "$KC" | awk '/\)/{print $2; exit}')
          if [ -n "$H" ]; then echo "KOI_SIGN_IDENTITY=$H" >> "$GITHUB_ENV"; echo "KOI_KEYCHAIN=$KC" >> "$GITHUB_ENV"; echo "stable identity $H"; else echo "::warning title=signing::no identity in KOI_CERT_P12; ad-hoc signing"; fi
          exit 0
      - run: sed -i.bak "s/__KOI_VERSION__/${{ steps.v.outputs.version }}/" renderer/app.html && rm renderer/app.html.bak
        if: steps.v.outputs.release == 'true'
      - name: Build DMGs and zips (retry on flaky hdiutil)
        if: steps.v.outputs.release == 'true'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "=== attempt $attempt"
            for v in /Volumes/Koi*; do [ -e "$v" ] && hdiutil detach "$v" -force || true; done
            rm -rf dist
            if npx electron-builder --mac --arm64 --x64 --publish never 2>&1 | tee build.log; [ "${PIPESTATUS[0]}" = "0" ]; then exit 0; fi
            msg=$(tail -25 build.log | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=attempt $attempt failed::$msg"
            sleep 8
          done
          exit 1
      - name: Verify signatures, versions and the files the updater needs
        if: steps.v.outputs.release == 'true'
        shell: bash
        run: |
          ls -la dist
          V=${{ steps.v.outputs.version }}
          for f in Koi-mac-arm64.zip Koi-mac-x64.zip Koi-mac-arm64.dmg Koi-mac-x64.dmg; do [ -s "dist/$f" ] || { echo "::error::missing dist/$f"; exit 1; }; done
          for a in dist/mac-arm64/Koi.app dist/mac/Koi.app; do
            if [ -d "$a" ]; then echo "== $a"; codesign -dv "$a" 2>&1 | head -8; codesign --verify --deep --strict "$a" || { echo "::error::signature invalid on $a"; exit 1; }
              got=$(defaults read "$PWD/$a/Contents/Info.plist" CFBundleShortVersionString); [ "$got" = "$V" ] || { echo "::error::$a is $got, expected $V"; exit 1; }; fi
          done
          # the zip must unpack to Koi.app with the right version, exactly like the updater does it
          rm -rf /tmp/kz && mkdir /tmp/kz && ditto -x -k dist/Koi-mac-arm64.zip /tmp/kz && got=$(defaults read /tmp/kz/Koi.app/Contents/Info.plist CFBundleShortVersionString) && [ "$got" = "$V" ] || { echo "::error::zip does not unpack to Koi.app $V"; exit 1; }
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.release == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Koi ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.dmg
            dist/*.zip
          make_latest: true
      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.release == 'true'
        with: { name: koi-dmg, path: dist/*.dmg }
